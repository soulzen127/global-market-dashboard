services:
  - type: web
    name: global-market-dashboard
    env: node
    plan: free
    buildCommand: "npm install --omit=dev"
    startCommand: "npm start"
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: INITIAL_SUPERVISOR_PASSWORD
        sync: false
